#VRML_SIM R2025a utf8
# TwoWheelRobot.proto - minimal differential-drive robot base for teams to
# customize. Chassis, wheels, motors, caster and physics are fixed/locked;
# teams may only change cosmetic fields and add their own sensors/parts
# through "extensionSlot" without touching the drivetrain itself.
# supervisor is hardcoded FALSE and not exposed, so it cannot be enabled.

PROTO TwoWheelRobot [
  field SFVec3f    translation    0 0 0
  field SFRotation rotation       0 0 1 0
  field SFString   name           "TwoWheelRobot"
  field SFString   controller     "<none>"
  field MFString   controllerArgs []
  field SFColor    bodyColor      0.15 0.15 0.6



#////////////////////////////////////////////
  #extentoin parts
  
field MFNode extensionSlot [
  # LEFT SIDE - 90 degrees
  Transform {
    translation 0.035 0 0.047
    rotation 0 0 1 1.5707963
    children [
      DistanceSensor {
        name "ds_left"
        type "laser"
        lookupTable [ 0 0 0, 0.8 0.8 0 ]
      }
    ]
  }

  # FRONT LEFT WIDE - about 50 degrees
  Transform {
    translation 0.035 0 0.047
    rotation 0 0 1 0.87
    children [
      DistanceSensor {
        name "ds_front_left_wide"
        type "laser"
        lookupTable [ 0 0 0, 0.8 0.8 0 ]
      }
    ]
  }

  # FRONT LEFT - about 25 degrees
  Transform {
    translation 0.035 0 0.047
    rotation 0 0 1 0.44
    children [
      DistanceSensor {
        name "ds_front_left"
        type "laser"
        lookupTable [ 0 0 0, 0.8 0.8 0 ]
      }
    ]
  }

  # FRONT - 0 degrees
  Transform {
    translation 0.035 0 0.047
    rotation 0 0 1 0
    children [
      DistanceSensor {
        name "ds_front"
        type "laser"
        lookupTable [ 0 0 0, 0.8 0.8 0 ]
      }
    ]
  }

  # FRONT RIGHT - about -25 degrees
  Transform {
    translation 0.035 0 0.047
    rotation 0 0 1 -0.44
    children [
      DistanceSensor {
        name "ds_front_right"
        type "laser"
        lookupTable [ 0 0 0, 0.8 0.8 0 ]
      }
    ]
  }

  # FRONT RIGHT WIDE - about -50 degrees
  Transform {
    translation 0.035 0 0.047
    rotation 0 0 1 -0.87
    children [
      DistanceSensor {
        name "ds_front_right_wide"
        type "laser"
        lookupTable [ 0 0 0, 0.8 0.8 0 ]
      }
    ]
  }

  # RIGHT SIDE - -90 degrees
  Transform {
    translation 0.035 0 0.047
    rotation 0 0 1 -1.5707963
    children [
      DistanceSensor {
        name "ds_right"
        type "laser"
        lookupTable [ 0 0 0, 0.8 0.8 0 ]
      }
    ]
  }

  # REAR - 180 degrees (for reversing safety)
  Transform {
    translation -0.035 0 0.047
    rotation 0 0 1 3.1415926
    children [
      DistanceSensor {
        name "ds_rear"
        type "laser"
        lookupTable [ 0 0 0, 0.8 0.8 0 ]
      }
    ]
  }

  # DOWNWARD CAMERA - front nose (x=0.042) to see floor clearly without chassis obstruction
  Transform {
    translation 0.042 0 0.045
    rotation 0 1 0 1.5707963
    children [
      Camera {
        name "camera_down"
        width 48
        height 48
        fieldOfView 1.1
        near 0.01
        far 0.4
      }
    ]
  }

  # ORIENTATION SENSOR
  InertialUnit {
    name "imu"
  }
]
#////////////////////////////////#



] {
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller IS controller
    controllerArgs IS controllerArgs
    supervisor FALSE
    children [
      # --- Chassis (cosmetic color only, dimensions locked) ---
      Transform {
        translation 0 0 0.04
        children [
          Shape {
            appearance PBRAppearance {
              baseColor IS bodyColor
              roughness 1
              metalness 0
            }
            geometry Box {
              size 0.08 0.05 0.03
            }
          }
        ]
      }

      # --- Left wheel ---
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor 0.012 0.032 0.02
        }
        device [
          RotationalMotor {
            name "left_wheel_motor"
          }
          PositionSensor {
            name "left_wheel_sensor"
          }
        ]
        endPoint Solid {
          translation 0.012 0.032 0.02
          rotation 1 0 0 1.5708
          children [
            Shape {
              appearance PBRAppearance {
                baseColor 0.05 0.05 0.05
                roughness 1
                metalness 0
              }
              geometry Cylinder {
                height 0.01
                radius 0.02
              }
            }
          ]
          name "left_wheel"
          boundingObject Cylinder {
            height 0.01
            radius 0.02
          }
          physics Physics {
            density -1
            mass 0.01
          }
        }
      }

      # --- Right wheel ---
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor 0.012 -0.032 0.02
        }
        device [
          RotationalMotor {
            name "right_wheel_motor"
          }
          PositionSensor {
            name "right_wheel_sensor"
          }
        ]
        endPoint Solid {
          translation 0.012 -0.032 0.02
          rotation 1 0 0 1.5708
          children [
            Shape {
              appearance PBRAppearance {
                baseColor 0.05 0.05 0.05
                roughness 1
                metalness 0
              }
              geometry Cylinder {
                height 0.01
                radius 0.02
              }
            }
          ]
          name "right_wheel"
          boundingObject Cylinder {
            height 0.01
            radius 0.02
          }
          physics Physics {
            density -1
            mass 0.01
          }
        }
      }

      # --- Rear caster ball (passive third contact point for stability) ---
      Transform {
        translation -0.03 0 0.008
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.3 0.3 0.3
              roughness 1
              metalness 0
            }
            geometry Sphere {
              radius 0.008
            }
          }
        ]
      }

      # --- Required status LEDs (fixed device names: led_blue / led_green) ---
      LED {
        translation 0.02 0.012 0.06
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0 0 0
              emissiveColor 0 0 1
              roughness 1
              metalness 0
            }
            geometry Sphere {
              radius 0.005
            }
          }
        ]
        name "led_blue"
        color [
          0 0 1
        ]
      }
      LED {
        translation 0.02 -0.012 0.06
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0 0 0
              emissiveColor 0 1 0
              roughness 1
              metalness 0
            }
            geometry Sphere {
              radius 0.005
            }
          }
        ]
        name "led_green"
        color [
          0 1 0
        ]
      }






      # --- Open slot: teams add their own sensors/parts here ---
      Group {
        children IS extensionSlot
      }
    ]



    boundingObject Group {
      children [
        Transform {
          translation 0 0 0.04
          children [
            Box {
              size 0.08 0.05 0.03
            }
          ]
        }
        Transform {
          translation -0.03 0 0.008
          children [
            Sphere {
              radius 0.008
            }
          ]
        }
      ]
    }
    physics Physics {
      density -1
      mass 0.15
    }
  }
}
